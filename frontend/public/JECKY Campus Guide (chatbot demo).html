<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JECKY Campus Guide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f3ea;--card:#ffffff;--tx:#0e1630;--mu:#5b6482;--bd:#e2dccb;--ac:#f2b632;--ub:#0e1630;--ut:#f6f3ea;--ok:#146c43;--no:#a61e1e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1630;--card:#172249;--tx:#f6f3ea;--mu:#a9b4d6;--bd:#2a3870;--ub:#f2b632;--ut:#0e1630;--ok:#6fdc9f;--no:#ff9a9a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1630;--card:#172249;--tx:#f6f3ea;--mu:#a9b4d6;--bd:#2a3870;--ub:#f2b632;--ut:#0e1630;--ok:#6fdc9f;--no:#ff9a9a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;display:flex;justify-content:center;background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,Arial,sans-serif}
.app{width:100%;max-width:780px;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#0e1630;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
header h1{font-size:18px;margin:0;font-weight:800}
header p{margin:2px 0 0;font-size:13px;color:var(--mu)}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:86%;padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.5}
.m p{margin:0}
.b{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.u{align-self:flex-end;background:var(--ub);color:var(--ut);border-bottom-right-radius:4px}
.card{margin-top:10px;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;padding:10px 12px;font-size:14px;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row span:first-child{color:var(--mu)}
.st{font-weight:800}.ok{color:var(--ok)}.no{color:var(--no)}.mid{color:var(--mu)}
.hd{padding:10px 12px;font-size:13px;color:var(--mu);border-bottom:1px solid var(--bd)}
.hd b{color:var(--tx);font-size:15px}
ol{margin:0;padding:12px 12px 12px 34px;font-size:14px;line-height:1.7}
ol li::marker{color:var(--mu);font-weight:800}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
#chips{display:flex;gap:8px;padding:8px 20px;overflow-x:auto}
#chips button{flex:none;white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 15px;font:600 13px inherit;font-family:inherit;cursor:pointer}
#chips button:hover{border-color:var(--ac)}
form{display:flex;gap:10px;padding:10px 20px 18px}
input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:13px 18px;font:400 15px inherit;font-family:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
form button{border:0;background:var(--ac);color:#0e1630;font-weight:800;border-radius:999px;padding:0 22px;font-family:inherit;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header><div class="av">J</div><div><h1>JECKY Campus Guide</h1><p>Ask about classes, notes, events and places</p></div></header>
<div id="log" aria-live="polite"></div>
<div id="chips"></div>
<form id="f"><input id="q" placeholder="Ask a question…" autocomplete="off" aria-label="Your question"><button type="submit">Send</button></form>
</div>
<script>
// ===== EDIT THESE: sample places. Replace with real JEC buildings, floors and directions. =====
var PLACES=[
{n:'Computer Lab',a:['computer lab','cse lab','lab'],w:'CSE Department, 1st floor',s:['Enter through the main gate','Walk straight to the CSE block','Take the stairs to the 1st floor','The lab is on your right']},
{n:'Library',a:['library','books'],w:'Central Library, ground floor',s:['Enter through the main gate','Turn left at the first junction','The library is the building ahead']},
{n:'Admin Office',a:['admin office','office'],w:'Administrative Building, ground floor',s:['Enter through the main gate','Walk straight for about two minutes','The office is the first building on your left']}
];
var QS=['What is JECKY?','Will today’s class be held?','Where is the computer lab?','Where do I find notes?','What events are coming up?','How do I contact the HoD?'];
var DEMO=[['9:00 AM','Data Structures','On','ok'],['10:00 AM','Mathematics','Cancelled','no'],['11:00 AM','Digital Electronics','Moved to 2 PM','mid']];
var T={
about:'JECKY is one smart platform for Jorhat Engineering College: a live timetable, notes, events, clubs, a faculty directory and this AI campus guide, all in one place instead of scattered WhatsApp chats.',
cls:'Check the live timetable. When a teacher edits or cancels a class, you see it instantly, so there’s no need to message the teacher or the CR. Here’s how it looks (demo data):',
notes:'Open the Notes section. Teachers upload study material for their classes, and you can download it from there, organised by class.',
events:'Upcoming events appear right on the JECKY homepage. Club admins and faculty members post them, so every notice reaches the whole college in one place.',
clubs:'The Clubs section lists every club with its description and member list, so you can discover clubs and approach their members easily.',
contact:'The Faculty Directory has contact details for important faculty members and the Head of Department, all in one place.',
roles:'Access depends on your role. Teachers edit or cancel their own classes and upload notes. Club admins and faculty members post events. Students view everything and ask this guide. Administrators publish verified information.',
none:'I’m still learning that one. Try a question below, or ask about the timetable, notes, events, clubs, faculty contacts or a place on campus.'
};
var I=[
['about',['jecky','what is','about','platform','who are you']],
['cls',['class','held','cancel','timetable','schedule','lecture']],
['roles',['who can','permission','role','access','post']],
['notes',['note','material','study','download']],
['events',['event','fest','upcoming','notice','happening']],
['clubs',['club','join','society']],
['contact',['hod','contact','faculty','professor','teacher','phone','head of']]
];
var log=document.getElementById('log'),q=document.getElementById('q');
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function add(who,nodes){var d=el('div','m '+who);[].concat(nodes).forEach(function(n){d.append(n)});log.append(d);log.scrollTop=log.scrollHeight;return d}
function has(l,k){return new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(l)}
function routeCard(p){var c=el('div','card'),h=el('div','hd');h.append(el('b','',p.n),document.createTextNode(' · '+p.w));c.append(h);var o=el('ol');p.s.forEach(function(s){o.append(el('li','',s))});c.append(o);return c}
function tableCard(){var c=el('div','card');DEMO.forEach(function(r){var w=el('div','row');w.append(el('span','',r[0]),el('span','',r[1]),el('span','st '+r[3],r[2]));c.append(w)});return c}
function answer(s){
var l=s.toLowerCase().trim();
if(/^(hi|hello|hey)\b/.test(l))return[el('p','','Hi! Ask me about classes, notes, events, clubs or where something is on campus.')];
var p=PLACES.filter(function(x){return x.a.some(function(a){return has(l,a)})})[0];
if(p)return[el('p','','Here’s how to reach the '+p.n+':'),routeCard(p)];
var best=null,top=0;
I.forEach(function(it){var n=it[1].filter(function(k){return has(l,k)}).length;if(n>top){top=n;best=it[0]}});
if(!best)return[el('p','',T.none)];
var out=[el('p','',T[best])];
if(best==='cls')out.push(tableCard());
return out}
function ask(s){
s=s.trim();if(!s)return;
add('u',el('p','',s));
var t=add('b',(function(){var d=el('span','dots');d.append(el('i'),el('i'),el('i'));return d})());
setTimeout(function(){t.remove();add('b',answer(s))},650)}
QS.forEach(function(s){var b=el('button','',s);b.type='button';b.onclick=function(){ask(s)};document.getElementById('chips').append(b)});
document.getElementById('f').onsubmit=function(e){e.preventDefault();var v=q.value;q.value='';ask(v)};
add('b',el('p','','Hi! I’m the JECKY campus guide. Ask me something, or tap a question below.'));
</script>
</body>
</html>
